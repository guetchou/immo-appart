services:

  # ── Base de données ──────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: ndombi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-immo_ndombi}
      POSTGRES_USER:     ${DB_USER:-ndombi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ndombi_pgdata:/var/lib/postgresql/data
    networks:
      - ndombi_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ndombi_user} -d ${DB_NAME:-immo_ndombi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Strapi CMS ────────────────────────────────────────
  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ndombi-strapi:latest
    container_name: ndombi-strapi
    restart: unless-stopped
    environment:
      NODE_ENV:           production
      HOST:               0.0.0.0
      PORT:               1337
      DATABASE_CLIENT:    postgres
      DATABASE_HOST:      postgres
      DATABASE_PORT:      5432
      DATABASE_NAME:      ${DB_NAME:-immo_ndombi}
      DATABASE_USERNAME:  ${DB_USER:-ndombi_user}
      DATABASE_PASSWORD:  ${DB_PASSWORD}
      DATABASE_SSL:       "false"
      APP_KEYS:           ${APP_KEYS}
      API_TOKEN_SALT:     ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET:   ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET:         ${JWT_SECRET}
    volumes:
      - ndombi_uploads:/opt/app/public/uploads
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ndombi_net

  # ── Next.js Frontend ─────────────────────────────────
  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://5.196.22.149:1337}
        NEXT_PUBLIC_SITE_URL:   ${NEXT_PUBLIC_SITE_URL:-https://residencendombi.lvaclean.cg}
        STRAPI_API_TOKEN:       ${STRAPI_API_TOKEN}
        PREVIEW_SECRET:         ${PREVIEW_SECRET}
        REVALIDATION_SECRET:    ${REVALIDATION_SECRET}
    image: ndombi-nextjs:latest
    container_name: ndombi-nextjs
    restart: unless-stopped
    environment:
      NODE_ENV:                production
      STRAPI_API_TOKEN:        ${STRAPI_API_TOKEN}
      NEXT_PUBLIC_STRAPI_URL:  ${NEXT_PUBLIC_STRAPI_URL:-http://5.196.22.149:1337}
      NEXT_PUBLIC_SITE_URL:    ${NEXT_PUBLIC_SITE_URL:-https://residencendombi.lvaclean.cg}
      PREVIEW_SECRET:          ${PREVIEW_SECRET}
      REVALIDATION_SECRET:     ${REVALIDATION_SECRET}
      RESEND_API_KEY:          ${RESEND_API_KEY:-}
      FROM_EMAIL:              ${FROM_EMAIL:-reservations@residencendombi.cg}
      OWNER_EMAIL:             ${OWNER_EMAIL:-residencendombi@gmail.com}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - strapi
    networks:
      - ndombi_net

volumes:
  ndombi_pgdata:
    name: ndombi_pgdata
  ndombi_uploads:
    name: ndombi_uploads

networks:
  ndombi_net:
    name: ndombi_net
    driver: bridge
