name: Deploy Backend (Strapi)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Strapi → VPS OVH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e

            echo "→ Pull latest code"
            cd /opt/immo-appart
            git pull origin main

            echo "→ Rebuild Strapi Docker image"
            docker compose up -d --build strapi

            echo "→ Smoke check Strapi"
            sleep 8
            curl -fsS http://127.0.0.1:1337/api/appartements >/dev/null

            echo "✅ Backend déployé sur ${{ secrets.VPS_HOST }}"
