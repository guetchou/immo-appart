name: Deploy Backend (Strapi)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ecosystem.config.js'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Strapi → VPS OVH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e

            echo "→ Pull latest code"
            cd /opt/immo-appart
            git pull origin main

            echo "→ Install dependencies"
            cd backend
            npm ci --omit=dev

            echo "→ Build Strapi"
            NODE_ENV=production npm run build

            echo "→ Restart PM2"
            pm2 restart ndombi-strapi 2>/dev/null || pm2 start /opt/immo-appart/ecosystem.config.js --only ndombi-strapi
            pm2 save

            echo "✅ Backend déployé sur ${{ secrets.VPS_HOST }}"
