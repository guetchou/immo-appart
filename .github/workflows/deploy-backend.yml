name: Deploy Backend (Strapi)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Strapi → VPS OVH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e

            echo "→ Pull latest code"
            cd /opt/immo-appart
            git pull origin main

            echo "→ Rebuild Strapi Docker image"
            docker compose up -d --build strapi

            echo "→ Smoke check Strapi"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:1337/api/appartements >/dev/null; then
                echo "Strapi is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Strapi did not become ready in time"
                docker logs --tail 120 ndombi-strapi
                exit 1
              fi
              sleep 3
            done

            echo "✅ Backend déployé sur ${{ secrets.VPS_HOST }}"
