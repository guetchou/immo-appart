name: Deploy Frontend (Next.js)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build → rsync → PM2 restart
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js (sur le runner GitHub — CPU rapide)
        working-directory: frontend
        env:
          NEXT_PUBLIC_STRAPI_URL:  ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
          STRAPI_API_TOKEN:        ${{ secrets.STRAPI_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL:    ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          PREVIEW_SECRET:          ${{ secrets.PREVIEW_SECRET }}
          REVALIDATION_SECRET:     ${{ secrets.REVALIDATION_SECRET }}
          FROM_EMAIL:              ${{ secrets.FROM_EMAIL }}
          OWNER_EMAIL:             ${{ secrets.OWNER_EMAIL }}
          STRAPI_INTERNAL_URL:     ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
          NODE_ENV: production
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # Préparer les deps de prod sur le VPS (une seule fois si package-lock n'a pas changé)
      - name: Install prod deps on VPS (si nécessaire)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/immo-appart/frontend && git pull origin main && npm ci --omit=dev 2>/dev/null || true"

      # Transférer uniquement le dossier .next/ buildé (artefacts compilés)
      - name: Sync .next/ vers VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/.next/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/immo-appart/frontend/.next/

      # Sync public/ (assets statiques)
      - name: Sync public/ vers VPS
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/public/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/immo-appart/frontend/public/

      # PM2 restart — quasi instantané
      - name: Restart Next.js via PM2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "STRAPI_INTERNAL_URL=http://127.0.0.1:1337 \
             NEXT_PUBLIC_STRAPI_URL=https://residencendombi.lvaclean.cg \
             NEXT_PUBLIC_SITE_URL=https://residencendombi.lvaclean.cg \
             pm2 restart ndombi-nextjs --update-env 2>/dev/null || \
             pm2 start /opt/immo-appart/ecosystem.config.js --only ndombi-nextjs; \
             pm2 save"

      - name: Vérification
        run: |
          sleep 8
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://${{ secrets.VPS_HOST_DOMAIN || secrets.VPS_HOST }}/ 2>/dev/null || echo "000")
          echo "Site HTTP: $STATUS"
