name: Deploy Frontend (Next.js)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'ecosystem.config.js'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Next.js → VPS OVH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build + deploy entièrement sur le VPS (évite de transférer .next)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e

            echo "→ Pull latest code"
            cd /opt/immo-appart
            git pull origin main

            echo "→ Install dependencies"
            cd frontend
            npm ci --omit=dev

            echo "→ Build Next.js"
            NODE_ENV=production npm run build

            echo "→ Restart PM2"
            pm2 restart ndombi-nextjs 2>/dev/null || pm2 start /opt/immo-appart/ecosystem.config.js --only ndombi-nextjs
            pm2 save

            echo "✅ Frontend déployé sur ${{ secrets.VPS_HOST }}"
