name: Deploy Frontend (Next.js)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Next.js 15
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Install ───────────────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── 4. Build Next.js ─────────────────────────────────
      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
          STRAPI_API_TOKEN:       ${{ secrets.STRAPI_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL:   ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NODE_ENV: production
        run: npm run build

      # ── 5. Deploy via SSH ────────────────────────────────
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e
            echo "→ Pull latest code"
            cd /opt/immo-appart
            git pull origin main

            echo "→ Install production dependencies"
            cd /opt/immo-appart/frontend
            npm ci --omit=dev

            echo "→ Build Next.js"
            NODE_ENV=production npm run build

            echo "→ Restart PM2"
            pm2 restart ndombi-frontend || pm2 start ecosystem.config.js --env production
            pm2 save

            echo "✅ Frontend déployé"
