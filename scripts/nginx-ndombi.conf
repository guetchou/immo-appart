# =============================================================
# Nginx — Résidence NDOMBI
# Copier dans /etc/nginx/sites-available/residencendombi.cg
# puis : ln -s /etc/nginx/sites-available/residencendombi.cg /etc/nginx/sites-enabled/
# puis : nginx -t && systemctl reload nginx
# =============================================================

# Strapi API + Admin
server {
    listen 80;
    server_name api.residencendombi.cg;

    location / {
        proxy_pass         http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }
}

# Next.js Frontend
server {
    listen 80;
    server_name residencendombi.cg www.residencendombi.cg;

    # Fichiers statiques Next.js
    location /_next/static/ {
        alias /opt/immo-appart/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:1337/uploads/;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
